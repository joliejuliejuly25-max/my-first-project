name: Replace blank.docx

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/replace-blank.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download generated DOCX
        run: |
          curl -fL 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-cc2c-81f5-a1f7-5f5892237f72/raw?se=2026-09-30T15%3A05%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=2cf1a2d9-8cbb-5558-b876-e52239d47052&skoid=bbd22fc4-f881-4ea4-b2f3-c12033cf6a8b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T13%3A18%3A33Z&ske=2026-10-01T13%3A18%3A33Z&sks=b&skv=2026-02-06&sig=iaFW7FzOL/eRMlJeYp350XBlhI0ICqkhdMMhX1fiYQE%3D' -o blank.docx
          unzip -t blank.docx >/dev/null

      - name: Commit updated blank.docx
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blank.docx
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update blank.docx"
            git push
          fi
